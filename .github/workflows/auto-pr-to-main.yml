name: Auto Create PR from test to main

on:
  push:
    branches:
      - test

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing PR and create if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING_PR=$(gh pr list --base main --head test --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "No open PR found from test to main. Creating one..."
            gh pr create \
              --base main \
              --head test \
              --title "Release: Merge test into main" \
              --body "Automated pull request triggered by new commits on \`test\`."
          else
            echo "Open PR #$EXISTING_PR already exists for test -> main. Skipping creation."
          fi